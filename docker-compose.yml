services:
  postgres:
    image: postgres:15-alpine
    container_name: ether-postgres
    environment:
      POSTGRES_USER: ether_user
      POSTGRES_PASSWORD: ether_password
      POSTGRES_DB: ether_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ether_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: ether-backend
    environment:
      DATABASE_URL: postgresql://ether_user:ether_password@postgres:5432/ether_db
      # Set MODEL_BUNDLE_PATH= (empty) to start without a model
      MODEL_BUNDLE_PATH: ${MODEL_BUNDLE_PATH-/models/current}
      # fake: canned answers, no key needed. meta: real Muse Spark, needs the key.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/backend:/app
      - ${MODEL_BUNDLE_DIR:-./app/ml_engine/artifacts/current}:/models/current:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: ether-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: ether-network
