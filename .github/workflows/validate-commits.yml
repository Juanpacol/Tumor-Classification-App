name: Validate Commit Messages

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit message format
        run: |
          echo "Validating commit messages format: AB-{TICKET}: type(scope): description"

          # Get commits in this PR
          commits=$(git log origin/main..HEAD --format=%H --no-merges)

          if [ -z "$commits" ]; then
            echo "No commits to validate"
            exit 0
          fi

          failed=0
          for commit in $commits; do
            msg=$(git log -1 --format=%B $commit)
            subject=$(git log -1 --format=%s $commit)

            # Format: AB-{TICKET}: type(scope): description
            # TICKET: issue number (e.g., AB-89)
            # type: feat, fix, docs, refactor, test, chore
            # scope: backend, ml_engine, frontend, infra
            if ! echo "$subject" | grep -qE "^AB-[0-9]+: (feat|fix|docs|refactor|test|chore)\([a-z_]+\):.+"; then
              echo "❌ Invalid commit message: $subject"
              echo "   Expected format: AB-{TICKET}: type(scope): description"
              echo "   Example: AB-89: feat(backend): add upload endpoint"
              echo "   "
              echo "   Full message:"
              echo "   $msg"
              failed=1
            else
              echo "✓ Valid: $subject"
            fi
          done

          if [ $failed -eq 1 ]; then
            exit 1
          fi
